<!DOCTYPE html>
<html>
<head>
  <!-- Replaced at build time by --base-href. GitHub Pages serves this from
       /chama360/, not the domain root, so it cannot be "/". -->
  <base href="/chama360/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Chama360 — run your chama: contributions, loans and members in one place.">

  <!-- viewport-fit=cover lets the app paint into the area behind the notch
       and the home indicator once installed, instead of sitting in a
       letterboxed white band. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS home-screen install.
       apple-mobile-web-app-capable is what makes it open without Safari's
       address bar; without it, "Add to Home Screen" produces a bookmark
       that opens in a browser tab and does not feel like an app.
       Apple ignores manifest.json icons, so apple-touch-icon is the only
       thing that sets the home-screen icon on iPhone. -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chama360">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icons/Icon-512.png">

  <meta name="theme-color" content="#4E9950">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Chama360</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown while the Flutter engine downloads. Without it the first load
       is a blank white page for several seconds on a slow connection,
       which reads as a broken link rather than an app starting. */
    body { margin: 0; background: #F3F8F3; }
    #boot {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #F3F8F3; transition: opacity .3s ease;
    }
    #boot img { width: 96px; height: 96px; }
    #boot .name { font-size: 17px; font-weight: 700; color: #1a1a1a; }
    #boot .spin {
      width: 24px; height: 24px; border: 3px solid rgba(78,153,80,.2);
      border-top-color: #4E9950; border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-color-scheme: dark) {
      body, #boot { background: #101711; }
      #boot .name { color: #f2f2f2; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <img src="icons/Icon-192.png" alt="Chama360">
    <div class="name">Chama360</div>
    <div class="spin"></div>
  </div>

  <script>
    // Flutter fires this once the first frame is on screen.
    window.addEventListener('flutter-first-frame', function () {
      var boot = document.getElementById('boot');
      if (!boot) return;
      boot.style.opacity = '0';
      setTimeout(function () { boot.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
